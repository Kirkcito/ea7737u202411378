<mat-button-toggle-group [value]="currentLanguage()" [attr.aria-label]="'toolbar.language' | translate" name="language">
  @for (language of languages; track language) {
    <mat-button-toggle [value]="language" (change)="useLanguage(language)">{{ language.toUpperCase() }}</mat-button-toggle>
  }
</mat-button-toggle-group>
